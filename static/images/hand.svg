<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="StereoLift dexterous hand">
  <title>StereoLift</title>
  <g transform="translate(3.4 0)" stroke="#141a22" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
    <!-- thumb: two phalanges angled out from the palm -->
    <g transform="rotate(-30 8.2 21.5)">
      <rect x="4.2" y="11.4" width="3.7" height="5" rx="1.85" fill="#e4572e"/>
      <rect x="4.2" y="16.4" width="3.7" height="6.2" rx="0.9" fill="#ffffff"/>
    </g>
    <!-- four fingers: coral fingertip segment over a white base segment -->
    <rect x="7.9" y="5.8" width="3.6" height="4.8" rx="1.8" fill="#e4572e"/>
    <rect x="7.9" y="10.6" width="3.6" height="6.8" rx="0.8" fill="#ffffff"/>
    <rect x="12.1" y="3.2" width="3.6" height="4.8" rx="1.8" fill="#e4572e"/>
    <rect x="12.1" y="8" width="3.6" height="9.4" rx="0.8" fill="#ffffff"/>
    <rect x="16.3" y="4.6" width="3.6" height="4.8" rx="1.8" fill="#e4572e"/>
    <rect x="16.3" y="9.4" width="3.6" height="8" rx="0.8" fill="#ffffff"/>
    <rect x="20.5" y="7.8" width="3.4" height="4.4" rx="1.7" fill="#e4572e"/>
    <rect x="20.5" y="12.2" width="3.4" height="5.2" rx="0.8" fill="#ffffff"/>
    <!-- palm with a small joint -->
    <rect x="7" y="15.6" width="17.6" height="9.4" rx="3" fill="#0f8b8d"/>
    <circle cx="15.8" cy="20.3" r="1.5" fill="#ffffff" stroke-width="1"/>
    <!-- wrist -->
    <rect x="10.6" y="25" width="10.4" height="4.8" rx="1.2" fill="#141a22"/>
  </g>
</svg>
