<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="StereoLift: a stereo pair lifted into 3D">
  <title>StereoLift</title>
  <g stroke="#141a22" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- rays from the two views converging on the lifted point -->
    <path d="M9 23.4 L14.9 17.6 M23 23.4 L17.1 17.6" fill="none" stroke-dasharray="1.7 1.5"/>
    <!-- lifted 3D cell: left face teal, right face coral, top face white -->
    <path d="M16 2.4 L22.6 6.2 L16 10 L9.4 6.2 Z" fill="#ffffff"/>
    <path d="M9.4 6.2 L16 10 L16 17.6 L9.4 13.8 Z" fill="#0f8b8d"/>
    <path d="M16 10 L22.6 6.2 L22.6 13.8 L16 17.6 Z" fill="#e4572e"/>
    <!-- stereo rig: one bar, two lenses -->
    <rect x="2.6" y="23.2" width="26.8" height="7" rx="3.5" fill="#141a22"/>
  </g>
  <circle cx="9" cy="26.7" r="2.35" fill="#0f8b8d" stroke="#ffffff" stroke-width="1.1"/>
  <circle cx="23" cy="26.7" r="2.35" fill="#e4572e" stroke="#ffffff" stroke-width="1.1"/>
</svg>
